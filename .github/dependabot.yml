version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

  - package-ecosystem: "maven"
    directory: "/java-maven"
    schedule:
      interval: "weekly"
    ignore:
      # Stay on Spring Boot 3.x; block 4.x major-version updates
      - dependency-name: "org.springframework.boot:*"
        versions: [">=4.0.0"]

  - package-ecosystem: "maven"
    directory: "/slides"
    schedule:
      interval: "weekly"
